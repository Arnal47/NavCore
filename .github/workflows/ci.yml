name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build -- -k 0
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/navcore_cli --map data/sample_map.csv --from A --to F --algo astar --cost time
